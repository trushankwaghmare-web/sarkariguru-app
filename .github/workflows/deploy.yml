name: SarkariGuru.AI Modernized Deployment & CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-and-lint:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Web Assets Structure
        run: |
          echo "Verifying core web deployment files..."
          test -f web/index.html || { echo "web/index.html missing!"; exit 1; }
          test -f web/sw.js || { echo "web/sw.js missing!"; exit 1; }
          test -f web/manifest.json || { echo "web/manifest.json missing!"; exit 1; }
          echo "All core assets present and validated."

      - name: Audit HTML Syntax & Tags
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('web/index.html', 'utf8');
            if (!html.includes('<!DOCTYPE html>')) throw new Error('Invalid DOCTYPE');
            console.log('HTML file integrity verified successfully.');
          "

  deploy-vercel:
    name: Deploy Landing Page to Vercel
    needs: validate-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Project Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        continue-on-error: true

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        continue-on-error: true

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        continue-on-error: true

  deploy-netlify:
    name: Deploy Landing Page to Netlify
    needs: validate-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './web'
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Automated Production Deploy (SarkariGuru.AI v3.0.0)"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        continue-on-error: true
